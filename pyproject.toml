[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wot-gui-assets-publisher"
version = "0.1.0"
description = "Project sealed GameSnapshots into pure-data wot-gui-assets branches"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
wot-gui-assets-publisher = "wot_gui_assets_publisher.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wot_gui_assets_publisher"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
